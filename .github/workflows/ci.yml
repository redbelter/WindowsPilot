name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    # tier 1: anywhere. Compile + syntax-check the portable test suites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: build (warnings are errors)
        working-directory: src/Pilot
        # net10.0-windows* TFMs on a Linux runner need the cross-targeting opt-in
        run: dotnet build -c Release -p:TreatWarningsAsErrors=true -p:WarningsAsErrors='' -p:EnableWindowsTargeting=true
      - name: suites compile
        run: python -m py_compile tests/windowspilot_smoke.py tests/windowspilot_rig.py

  smoke:
    # tier 2: needs a logged-on interactive session (UIA + SendInput are blind
    # in Session 0). windows-latest boots one; ubuntu-latest does not.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: publish + start pilot
        shell: pwsh
        run: |
          Push-Location src/Pilot
          # self-contained: GUI-subsystem exe must boot without hunting for
          # the shared Windows Desktop runtime on the runner
          dotnet publish -c Release -r win-x64 --self-contained true -o ../../publish_out
          Pop-Location
          # same config shape install.ps1 proves on guests: rig profile +
          # auto-arm in pilot.json (bool env "1" does NOT parse; write the JSON),
          # named tokens for both scopes
          $dir = "$env:LOCALAPPDATA\WindowsPilot"
          New-Item -ItemType Directory -Force $dir | Out-Null
          @{ bind='loopback'; governance=@{ allow_mcp_arm=$true; auto_arm='startup'; rate_per_min=300; rate_burst=60 }; capture=@{ prefer='gdi' }; rig=@{ profile=$true } } | ConvertTo-Json -Depth 5 | Set-Content "$dir\pilot.json" -Encoding UTF8
          Set-Content "$dir\tokens.json" -Value '{"act-rig-1":"act","ro-rig-1":"ro"}' -Encoding ascii
          Start-Process -FilePath "$PWD\publish_out\WindowsPilot.exe" -WorkingDirectory "$PWD\publish_out"
          Start-Sleep -Seconds 4
      - name: health gate
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\WindowsPilot\pilot.log"
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-RestMethod http://localhost:8791/api/status -TimeoutSec 5
              if ($r.ok) { "pilot up: " + $r.data.version; exit 0 }
            } catch { Start-Sleep -Seconds 1 }
          }
          # self-reporting failure: annotations only show the exit code, so push
          # diagnostics through BOTH channels — step summary + ::warning:: annotation
          $proc = @(Get-Process WindowsPilot -ErrorAction SilentlyContinue).Count
          $logTail = if (Test-Path $log) { (Get-Content $log -Tail 15) -join ' ~ ' } else { "(no pilot.log at $log)" }
          ("## health gate failed`n`n- WindowsPilot processes: $proc`n````n$logTail`n````") | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Output "::warning::pilot procs=$proc log: $logTail"
          Write-Error "pilot never answered /api/status"
          exit 1
      - name: portable suite
        run: python tests/windowspilot_smoke.py --base http://localhost:8791 --only health
      - name: governance rig
        shell: pwsh
        run: |
          $out = python tests/windowspilot_rig.py --base http://localhost:8791 --token act-rig-1 2>&1 | Out-String
          ($out -split "`r?`n" | Where-Object { $_ -match '^(FAIL|RESULT)' }) | ForEach-Object { Write-Output "::warning::$_" }
          if ($LASTEXITCODE -ne 0) { exit 1 }
